<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI问答系统</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .question-box {
            margin: 20px 0;
        }
        .input-group {
            margin: 20px 0;
        }
        input[type="text"] {
            width: 70%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .answer {
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI问答系统</h1>
        <div class="question-box">
            <form method="post">
                <div class="input-group">
                    <input type="text" name="question" placeholder="请输入问题..." required>
                    <button type="submit">提交</button>
                </div>
            </form>
        </div>
        <div class="answer">
            <h2>回答：</h2>
            <p>{{ answer }}</p>
        </div>
    </div>
<a href="http://127.0.0.1:5000" class="return-btn">返回</a>
</body>
</html>
