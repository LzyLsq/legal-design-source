<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据监控大屏</title>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
  <style>
    /* 全局样式 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background-color: #051a2a;
      color: #e0e0e0;
      line-height: 1.6;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }


    /* 动态流光网格背景 */
    .tech-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
              linear-gradient(to right, rgba(0, 255, 255, 0.3) 1px, transparent 1px),
              linear-gradient(to bottom, rgba(0, 255, 255, 0.3) 1px, transparent 1px);
      background-size: 20px 20px;
      z-index: -2;
      opacity: 0.8;
      animation: gridPulse 4s infinite;
    }

    @keyframes gridPulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .glow-effect {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(0, 255, 255, 0.03) 0%, transparent 70%);
      z-index: -1;
    }

    /* 动态粒子效果 */
    .tech-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* 头部样式 */
    .header {
      background: linear-gradient(135deg, #003366, #0066cc);
      color: white;
      padding: 20px 0;
      text-align: center;
      margin-bottom: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      position: relative;
      border: 1px solid #004d99;
      background-clip: padding-box;
    }

    .header h1 {
      font-size: 36px;
      margin-bottom: 10px;
      font-weight: 600;
      background: linear-gradient(90deg, #ffffff, #00FFFF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      position: relative;
    }

    .header h1::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, #00FFFF, #0088FF);
      border-radius: 3px;
    }

    .last-updated, .auto-refresh {
      font-size: 14px;
      margin: 5px 0;
      opacity: 0.9;
    }

    /* 筛选区样式 */
    .filter-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 15px;
      margin: 0 10px 30px;
      padding: 20px;
      background-color: #003366;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      border: 1px solid #004d99;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .filter-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(45deg, rgba(0, 255, 255, 0.15) 25%, transparent 25%, transparent 75%, rgba(0, 255, 255, 0.15) 75%, rgba(0, 255, 255, 0.15));
      background-size: 20px 20px;
      opacity: 0.7;
      z-index: -1;
    }

    .filter-container:hover {
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      transform: translateY(-2px);
    }

    .filter-group {
      display: flex;
      flex-direction: column;
    }

    .filter-label {
      font-size: 14px;
      margin-bottom: 8px;
      color: #00FFFF;
      font-weight: 500;
    }

    .filter-select {
      padding: 10px 16px;
      border: 1px solid #004d99;
      border-radius: 8px;
      background-color: #003366;
      color: #e0e0e0;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300FFFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 18px;
      font-size: 14px;
      transition: all 0.3s ease;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1) inset;
    }

    .filter-select:hover, .filter-select:focus {
      border-color: #00FFFF;
      box-shadow: 0 0 0 2px rgba(0, 255, 255, 0.3), 0 2px 5px rgba(0, 0, 0, 0.1) inset;
      outline: none;
    }

    /* 按钮样式 */
    .button-container {
      display: flex;
      justify-content: center;
      margin: 30px 0;
      gap: 20px;
    }

    .button {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    .apply-button {
      background: linear-gradient(135deg, #004d99, #0088ff);
      color: white;
    }

    .apply-button:hover {
      background: linear-gradient(135deg, #0088ff, #00aaff);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    .reset-button {
      background-color: #003366;
      color: #00FFFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reset-button::before {
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-right: 8px;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300FFFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3ccircle cx='12' cy='12' r='10'%3e%3c/circle%3e%3cpath d='M12 8v4l3 3'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-size: contain;
    }

    .reset-button:hover {
      background-color: #004d99;
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .button::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    .button:hover::after {
      transform: translateX(0);
    }

    /* 数据统计卡片样式 */
    .total-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin: 0 10px 30px;
    }

    .stat-card {
      background: linear-gradient(135deg, #002244, #003366);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      padding: 25px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
      border: 1px solid #004d99;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 10h5v5h-5zM20 10h5v5h-5zM30 10h5v5h-5zM40 10h5v5h-5zM50 10h5v5h-5zM60 10h5v5h-5zM70 10h5v5h-5zM10 20h5v5h-5zM20 20h5v5h-5zM30 20h5v5h-5zM40 20h5v5h-5zM50 20h5v5h-5zM60 20h5v5h-5zM70 20h5v5h-5zM10 30h5v5h-5zM20 30h5v5h-5zM30 30h5v5h-5zM40 30h5v5h-5zM50 30h5v5h-5zM60 30h5v5h-5zM70 30h5v5h-5zM10 40h5v5h-5zM20 40h5v5h-5zM30 40h5v5h-5zM40 40h5v5h-5zM50 40h5v5h-5zM60 40h5v5h-5zM70 40h5v5h-5zM10 50h5v5h-5zM20 50h5v5h-5zM30 50h5v5h-5zM40 50h5v5h-5zM50 50h5v5h-5zM60 50h5v5h-5zM70 50h5v5h-5zM10 60h5v5h-5zM20 60h5v5h-5zM30 60h5v5h-5zM40 60h5v5h-5zM50 60h5v5h-5zM60 60h5v5h-5zM70 60h5v5h-5zM10 70h5v5h-5zM20 70h5v5h-5zM30 70h5v5h-5zM40 70h5v5h-5zM50 70h5v5h-5zM60 70h5v5h-5zM70 70h5v5h-5z' fill='%2300FFFF' fill-opacity='0.2'/%3E%3C/svg%3E");
      opacity: 0.3;
      z-index: -1;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, rgba(0, 255, 255, 0.1), transparent);
      animation: glowBar 8s infinite;
    }

    @keyframes glowBar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .stat-label {
      font-size: 14px;
      color: #00FFFF;
      margin-bottom: 12px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(90deg, #ffffff, #00FFFF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
    }

    /* 数据看板区域 */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
      margin: 0 10px 30px;
      max-width: 1600px;
    }

    .card {
      background: linear-gradient(135deg, #002244, #003366);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      padding: 30px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
      border: 1px solid #004d99;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 10h5v5h-5zM20 10h5v5h-5zM30 10h5v5h-5zM40 10h5v5h-5zM50 10h5v5h-5zM60 10h5v5h-5zM70 10h5v5h-5zM10 20h5v5h-5zM20 20h5v5h-5zM30 20h5v5h-5zM40 20h5v5h-5zM50 20h5v5h-5zM60 20h5v5h-5zM70 20h5v5h-5zM10 30h5v5h-5zM20 30h5v5h-5zM30 30h5v5h-5zM40 30h5v5h-5zM50 30h5v5h-5zM60 30h5v5h-5zM70 30h5v5h-5zM10 40h5v5h-5zM20 40h5v5h-5zM30 40h5v5h-5zM40 40h5v5h-5zM50 40h5v5h-5zM60 40h5v5h-5zM70 40h5v5h-5zM10 50h5v5h-5zM20 50h5v5h-5zM30 50h5v5h-5zM40 50h5v5h-5zM50 50h5v5h-5zM60 50h5v5h-5zM70 50h5v5h-5zM10 60h5v5h-5zM20 60h5v5h-5zM30 60h5v5h-5zM40 60h5v5h-5zM50 60h5v5h-5zM60 60h5v5h-5zM70 60h5v5h-5zM10 70h5v5h-5zM20 70h5v5h-5zM30 70h5v5h-5zM40 70h5v5h-5zM50 70h5v5h-5zM60 70h5v5h-5zM70 70h5v5h-5z' fill='%2300FFFF' fill-opacity='0.2'/%3E%3C/svg%3E");
      opacity: 0.3;
      z-index: -1;
    }

    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, rgba(0, 255, 255, 0.1), transparent);
      animation: glowBar 8s infinite;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #ffffff;
      display: flex;
      align-items: center;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 22px;
      background-color: #00FFFF;
      margin-right: 12px;
      border-radius: 3px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 5px rgba(0, 255, 255, 0.3); }
      to { box-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }
    }

    .chart-container {
      width: 100%;
      height: 300px;
      position: relative;
    }

    .chart-info {
      margin-top: 15px;
      font-size: 14px;
      color: #00FFFF;
    }

    /* 合同类型卡片样式 */
    .contract-type-card {
      grid-column: span 2;
    }

    /* 排名卡片样式 */
    .ranking-card {
      background: linear-gradient(135deg, #002244, #003366);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      padding: 30px;
      height: 550px;
      overflow: auto;
      margin: 0 10px 30px;
      border: 1px solid #004d99;
      position: relative;
    }

    .ranking-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 10h5v5h-5zM20 10h5v5h-5zM30 10h5v5h-5zM40 10h5v5h-5zM50 10h5v5h-5zM60 10h5v5h-5zM70 10h5v5h-5zM10 20h5v5h-5zM20 20h5v5h-5zM30 20h5v5h-5zM40 20h5v5h-5zM50 20h5v5h-5zM60 20h5v5h-5zM70 20h5v5h-5zM10 30h5v5h-5zM20 30h5v5h-5zM30 30h5v5h-5zM40 30h5v5h-5zM50 30h5v5h-5zM60 30h5v5h-5zM70 30h5v5h-5zM10 40h5v5h-5zM20 40h5v5h-5zM30 40h5v5h-5zM40 40h5v5h-5zM50 40h5v5h-5zM60 40h5v5h-5zM70 40h5v5h-5zM10 50h5v5h-5zM20 50h5v5h-5zM30 50h5v5h-5zM40 50h5v5h-5zM50 50h5v5h-5zM60 50h5v5h-5zM70 50h5v5h-5zM10 60h5v5h-5zM20 60h5v5h-5zM30 60h5v5h-5zM40 60h5v5h-5zM50 60h5v5h-5zM60 60h5v5h-5zM70 60h5v5h-5zM10 70h5v5h-5zM20 70h5v5h-5zM30 70h5v5h-5zM40 70h5v5h-5zM50 70h5v5h-5zM60 70h5v5h-5zM70 70h5v5h-5z' fill='%2300FFFF' fill-opacity='0.2'/%3E%3C/svg%3E");
      opacity: 0.3;
      z-index: -1;
    }

    .ranking-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, rgba(0, 255, 255, 0.1), transparent);
      animation: glowBar 8s infinite;
    }

    .ranking-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #ffffff;
      display: flex;
      align-items: center;
    }

    .ranking-title::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 22px;
      background-color: #00FFFF;
      margin-right: 12px;
      border-radius: 3px;
      animation: glow 2s infinite alternate;
    }

    .ranking-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .ranking-list li {
      padding: 18px;
      border-bottom: 1px solid #004d99;
      display: flex;
      align-items: center;
      transition: background-color 0.3s ease;
    }

    .ranking-list li:hover {
      background-color: #004d99;
    }

    .ranking-list li:last-child {
      border-bottom: none;
    }

    .ranking-customer-id {
      font-weight: 600;
      color: #00FFFF;
    }

    .ranking-contract-name {
      flex-grow: 1;
      margin: 0 18px;
      font-weight: 500;
    }

    .ranking-start-date {
      font-size: 14px;
      color: #00FFFF;
      margin-right: 18px;
    }

    .ranking-risk-level {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }

    .ranking-risk-index {
      font-size: 14px;
      margin-left: 12px;
      font-weight: 500;
    }

    .low-risk {
      background-color: rgba(0, 255, 255, 0.15);
      color: #00FFFF;
    }

    .medium-risk {
      background-color: rgba(255, 193, 7, 0.15);
      color: #ffab00;
    }

    .high-risk {
      background-color: rgba(244, 67, 54, 0.15);
      color: #d32f2f;
    }

    /* 响应式设计 */
    @media (max-width: 1200px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      .contract-type-card {
        grid-column: span 1;
      }
    }

    @media (max-width: 768px) {
      .filter-container {
        grid-template-columns: repeat(2, 1fr);
      }

      .total-stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .filter-container {
        grid-template-columns: 1fr;
      }

      .total-stats {
        grid-template-columns: 1fr;
      }
    }

    /* 页脚样式 */
    .footer {
      text-align: center;
      padding: 30px;
      color: #00FFFF;
      font-size: 14px;
      border-top: 1px solid #004d99;
      margin-top: 30px;
      position: relative;
    }

    .footer span {
      color: #00FFFF;
      font-size: 13px;
    }

    /* 退出按钮样式 */
    .logout-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    /* 图表全屏按钮 */
    .chart-fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .chart-fullscreen-btn:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .chart-fullscreen-btn::before {
      content: '';
      width: 16px;
      height: 16px;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300FFFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpath d='M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m0 0v-3a2 2 0 0 1 2-2h3'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-size: contain;
    }
  </style>
</head>
<body>
<!-- 科技感背景效果 -->
<div class="tech-grid"></div>
<div class="glow-effect"></div>
<div class="ripple-container">
  <div class="ripple"></div>
  <div class="ripple"></div>
  <div class="ripple"></div>
</div>
<canvas class="tech-particles" id="tech-particles"></canvas>

<!-- 加载动画 -->
<div class="loader" id="loader"></div>

<!-- 页面头部 -->
<header class="header">
  <h1>合同风险实时监控大屏</h1>
  <div class="last-updated">数据最后更新时间: <span id="last-updated"></span></div>
  <div class="auto-refresh"></div>
  <button class="logout-btn" id="logout-btn">退出系统</button>
</header>

<!-- 筛选区域 -->
<section class="filter-container">
  <div class="filter-group">
    <label class="filter-label">时间范围</label>
    <select class="filter-select" id="time-range">
      <option value="all">所有时间</option>
      <option value="7days">过去7天</option>
      <option value="30days">过去30天</option>
      <option value="90days">过去90天</option>
      <option value="1year">过去一年</option>
      <option value="custom">自定义范围</option>
    </select>
  </div>

    };

  // 更新图表数据
  function updateCharts() {
    const filters = getFilters();

    // 更新最后更新时间
    const now = new Date();
    const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    document.getElementById('last-updated').textContent = formattedDate;

    // 获取数据
    fetch('/api/risk-stats', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(filters),
    })
            .then(response => response.json())
            .then(data => {
              // 更新统计数据
              document.getElementById('total-contracts').textContent = data.total_contracts || 0;
              document.getElementById('total-amount').textContent = (data.total_amount || 0).toFixed(2);
              document.getElementById('high-risk-contracts').textContent = data.risk_distribution['高风险'] || 0;

              // 计算风险指数
              const totalContracts = data.total_contracts || 1;
              const highRiskContracts = data.risk_distribution['高风险'] || 0;
              const riskIndex = Math.round((highRiskContracts / totalContracts) * 100);
              document.getElementById('risk-index').textContent = `${riskIndex}%`;

              // 更新风险分布图表

                { value: data.risk_distribution['低风险'] || 0, name: '低风险' },
                { value: data.risk_distribution['中风险'] || 0, name: '中风险' },

                series: [ {
                  data: riskDistributionData
                } ]
              });

                series: [ {
                  data: [
                    data.amount_distribution['低'] || 0,

                series: [ {
                  data: creditRatingData

                        items.forEach(item => {
                          const dateString = item.performance_period_start;
                          const parts = dateString.split(/, | /);
                          const day = parts[1];
                          const month = parts[2];
                          const year = parts[3];
                          const time = parts[4];

                          const monthMap = {
                            Jan: 1, Feb: 2, Mar: 3, Apr: 4, May: 5, Jun: 6,
                            Jul: 7, Aug: 8, Sep: 9, Oct: 10, Nov: 11, Dec: 12
                          };
                          const monthNumber = monthMap[month];

                          const dateKey = `${year}-${monthNumber}`;

                          if (!dateGroups[dateKey]) {
                            dateGroups[dateKey] = { low: 0, medium: 0, high: 0 };
                          }

                          switch (item.risk_level) {
                            case '低风险':
                              dateGroups[dateKey].low += 1;
                              break;
                            case '中风险':
                              dateGroups[dateKey].medium += 1;
                              break;
                            case '高风险':
                              dateGroups[dateKey].high += 1;
                              break;
                          }
                        });

                        const dates = Object.keys(dateGroups).sort();
                        const lowData = dates.map(date => dateGroups[date].low);
                        const mediumData = dates.map(date => dateGroups[date].medium);
                        const highData = dates.map(date => dateGroups[date].high);

                        riskTrendChart.setOption({
                          xAxis: {
                            data: dates
                          },
                          series: [
                            {
                              name: '低风险',
                              data: lowData
                            },
                            {
                              name: '中风险',
                              data: mediumData
                            },
                            {
                              name: '高风险',
                              data: highData
                            }
                          ]
                        });
                      });

              // 更新合同类型分布图表
              const contractTypeData = Object.entries(data.contract_type_distribution).map(([name, value]) => ({
                name: name,
                value: value
              }));
              contractTypeChart.setOption({
                series: [ {
                  data: contractTypeData
                } ]
              });

              // 更新风险排名前十列表
              const rankingList = document.getElementById('ranking-list');
              rankingList.innerHTML = '';

              data.top_contracts.forEach(contract => {
                const li = document.createElement('li');
                li.innerHTML = `
              <span class="ranking-customer-id">${contract.customer_id}</span>
              <span class="ranking-contract-name">${contract.contract_name}</span>
              <span class="ranking-start-date">开始时间: ${contract.performance_period_start}</span>
              <span class="ranking-risk-level ${getRiskClass(contract.risk_level)}">
                ${contract.risk_level}
              </span>
              <span class="ranking-risk-index">风险指数: ${contract.risk_index}</span>
            `;
                rankingList.appendChild(li);
              });
            })
            .catch(error => {
              console.error('Error updating charts:', error);
            });
  }

  // 获取风险等级对应的CSS类名
  function getRiskClass(riskLevel) {
    switch (riskLevel) {
      case '低风险':
        return 'low-risk';
      case '中风险':
        return 'medium-risk';
      case '高风险':
        return 'high-risk';
      default:
        return '';
    }
  }

  // 初始化粒子效果
  function initParticles() {
    const canvas = document.getElementById('tech-particles');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const particleCount = 100;

    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 1,
        color: `rgba(0, 255, 255, ${Math.random() * 0.3 + 0.2})`,
        speedX: Math.random() * 1 - 0.5,
        speedY: Math.random() * 1 - 0.5,
        pulse: Math.random() * 0.5 + 0.5
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(particle => {
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
        ctx.fillStyle = particle.color;
        ctx.fill();

        particle.x += particle.speedX;
        particle.y += particle.speedY;

        if (particle.x < 0 || particle.x > canvas.width) {
          particle.speedX = -particle.speedX;
        }

        if (particle.y < 0 || particle.y > canvas.height) {
          particle.speedY = -particle.speedY;
        }

        // 脉冲效果
        particle.radius = Math.sin(Date.now() * 0.001 * particle.pulse) * 1 + 1;
      });

      requestAnimationFrame(animate);
    }

    animate();
  }

  // 初始加载数据
  updateCharts();
  initParticles();

  // 重置单个筛选项
  function resetFilterItem(filterId) {
    document.getElementById(filterId).value = 'all';
  }

  // 应用筛选按钮
  document.getElementById('apply-filter').addEventListener('click', updateCharts);

  // 重置筛选按钮
  document.getElementById('reset-filter').addEventListener('click', function() {
    // 重置所有筛选条件
    document.getElementById('time-range').value = 'all';
    document.getElementById('contract-type').value = 'all';
    document.getElementById('risk-level').value = 'all';
    document.getElementById('amount-range').value = 'all';
    document.getElementById('party-a-credit').value = 'all';
    document.getElementById('party-b-credit').value = 'all';

    // 更新图表
    updateCharts();
  });

  // 图表全屏功能
  document.querySelectorAll('.chart-fullscreen-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const chartId = this.getAttribute('data-chart-id');
      const chartElement = document.getElementById(chartId);
      const chartInstance = echarts.getInstanceByDom(chartElement);

      if (!document.fullscreenElement) {
        // 进入全屏
        if (chartElement.requestFullscreen) {
          chartElement.requestFullscreen();
        } else if (chartElement.webkitRequestFullscreen) { /* Safari */
          chartElement.webkitRequestFullscreen();
        } else if (chartElement.msRequestFullscreen) { /* IE11 */
          chartElement.msRequestFullscreen();
        }
      } else {
        // 退出全屏
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) { /* Safari */
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) { /* IE11 */
          document.msExitFullscreen();
        }
      }

      // 重新调整图表大小
      setTimeout(() => {
        chartInstance.resize();
      }, 100);
    });
  });

  // 监听全屏状态变化，确保退出全屏后图表恢复原状
  document.addEventListener('fullscreenchange', function() {
    if (!document.fullscreenElement) {
      // 退出全屏后重新调整所有图表大小
      setTimeout(() => {
        echarts.getInstanceByDom(document.getElementById('risk-distribution-chart')).resize();
        echarts.getInstanceByDom(document.getElementById('amount-distribution-chart')).resize();
        echarts.getInstanceByDom(document.getElementById('credit-rating-chart')).resize();
        echarts.getInstanceByDom(document.getElementById('risk-trend-chart')).resize();
        echarts.getInstanceByDom(document.getElementById('contract-type-chart')).resize();
      }, 100);
    }
  });

  // 每5秒自动刷新数据
  setInterval(updateCharts, 5000);

  // 响应式调整
  window.addEventListener('resize', function() {
    const techParticles = document.getElementById('tech-particles');
    if (techParticles) {
      techParticles.width = window.innerWidth;
      techParticles.height = window.innerHeight;
    }
  });
</script>
