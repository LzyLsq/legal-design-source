<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法律法规知识图谱</title>
    <link href="../static/style.css" rel="stylesheet" type="text/css"/>
    <script src="https://d3js.org/d3.v3.min.js" charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
</head>
<body>
<button class="toggle-btn" onclick="toggleSidebar()">&#9776;</button>

<aside class="sidebar" id="sidebar">
    <div class="container">
        <button class="button" onclick="jumpToURL()" style="margin-left: 150px;">首页</button>
        <h1>法律法规知识图谱</h1>
        <div class="parent">
            <input type="text" id="searchText" class="searchText" placeholder="搜索合同条文或节点..." autocomplete="off">
            <input type="button" id="searchBtn" class="searchBtn">
            <div class="search-results" id="searchResults"></div>
        </div>
        <div class="path-info" id="pathInfo"></div>
    </div>
    <ul id="sideul"></ul>
</aside>

<div class="main-content">
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>
    <div id="graph-container"></div>
</div>

<script>
    function showLoading() {
        document.getElementById('loading').style.display = 'flex';
    }

    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
    }

    function jumpToURL() {
        window.location.href = "http://127.0.0.1:5000/dashboard";
    }

    var margin = {top: 20, right: 120, bottom: 20, left: 120},
        width = window.innerWidth - margin.right - margin.left,
        height = window.innerHeight - margin.top - margin.bottom - 20;

    var i = 0,
        duration = 750,
        root;

    var tree = d3.layout.tree()
        .size([height, width]);

    var diagonal = d3.svg.diagonal()
        .projection(function(d) {
            return [d.y, d.x];
        });

    var svg = d3.select("#graph-container").append("svg")
        .attr("width", width + margin.right + margin.left)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    var tooltip = d3.select("body").append("div")
        .attr("class", "tooltip")
        .style("opacity", 0);

    var myData;
    var nodeMap = {};
    var currentSidebarNode = null;

    function initChart() {
        showLoading();

        d3.json("data.json", function(error, flare) {
            if (error) {
                hideLoading();
                alert("加载数据失败，请刷新重试");
                throw error;
            }

            function collapse(d) {
                if (d.children) {
                    d._children = d.children;
                    d._children.forEach(collapse);
                    d.children = null;
                }
            }

            myData = flare;
            myData.children.forEach(collapse);

            function buildNodeMap(node, parent) {
                nodeMap[node.name] = node;
                node.parent = parent; // 添加父节点引用
                if (node.children) {
                    node.children.forEach(function(child) {
                        buildNodeMap(child, node);
                    });
                }
                if (node._children) {
                    node._children.forEach(function(child) {
                        buildNodeMap(child, node);
                    });
                }
            }
            buildNodeMap(myData, null);

            currentSidebarNode = myData;
            updateSidebar(currentSidebarNode);

            if (myData.children && myData.children.length > 0) {
                root = myData.children[0];
                root.x0 = height / 2;
                root.y0 = 0;
                update(root);
            }
            hideLoading();
        });
    }

    function update(source) {
        var nodes = tree.nodes(root).reverse(),
            links = tree.links(nodes);

        nodes.forEach(function(d) {
            d.y = d.children || d._children ? d.depth * 200 + 150 : d.depth * 200 + 50;
        });

        var node = svg.selectAll("g.node")
            .data(nodes, function(d) {
                return d.id || (d.id = ++i);
            });

        var nodeEnter = node.enter().append("g")
            .attr("class", "node")
            .attr("transform", function(d) {
                return "translate(" + source.y0 + "," + source.x0 + ")";
            })
            .on("click", function(d) {
                click(d);
                updateSidebar(d); // 同步侧边栏
            })
            .on("mouseover", mouseover)
            .on("mouseout", mouseout);

        nodeEnter.append("circle")
            .attr("r", 1e-6)
            .style("fill", function(d) {
                return d._children ? "#f0ead6" : (d.children ? "#fff" : "#4a90e2");
            })
            .style("stroke", function(d) {
                return d._children ? "#d4c9a1" : (d.children ? "#4a90e2" : "#2c7be5");
            });

        nodeEnter.append("text")
            .attr("x", function(d) {
                return d.children || d._children ? -10 : 10;
            })
            .attr("dy", ".35em")
            .attr("text-anchor", function(d) {
                return d.children || d._children ? "end" : "start";
            })
            .text(function(d) {
                return d.name;
            })
            .style("fill-opacity", 1e-6);

        var nodeUpdate = node.transition()
            .duration(duration)
            .attr("transform", function(d) {
                return "translate(" + d.y + "," + d.x + ")";
            });

        nodeUpdate.select("circle")
            .attr("r", 6)
            .style("fill", function(d) {
                return d._children ? "#f0ead6" : (d.children ? "#fff" : "#4a90e2");
            })
            .style("stroke-width", function(d) {
                return d._children || d.children ? "2px" : "1px";
            });

        nodeUpdate.select("text")
            .style("fill-opacity", 1)
            .style("font-weight", function(d) {
                return d.depth === 0 ? "bold" : "normal";
            });

        var nodeExit = node.exit().transition()
            .duration(duration)
            .attr("transform", function(d) {
                return "translate(" + source.y + "," + source.x + ")";
            })
            .remove();

        nodeExit.select("circle")
            .attr("r", 1e-6);

        nodeExit.select("text")
            .style("fill-opacity", 1e-6);

        var link = svg.selectAll("path.link")
            .data(links, function(d) {
                return d.target.id;
            });

        link.enter().insert("path", "g")
            .attr("class", "link")
            .attr("d", function(d) {
                var o = {x: source.x0, y: source.y0};
                return diagonal({source: o, target: o});
            });

        link.transition()
            .duration(duration)
            .attr("d", diagonal);

        link.exit().transition()
            .duration(duration)
            .attr("d", function(d) {
                var o = {x: source.x, y: source.y};
                return diagonal({source: o, target: o});
            })
            .remove();

        nodes.forEach(function(d) {
            d.x0 = d.x;
            d.y0 = d.y;
        });
    }

    function click(d) {
        if (d.children) {
            d._children = d.children;
            d.children = null;
        } else {
            d.children = d._children;
            d._children = null;
        }
        update(d);
    }

    function mouseover(d) {
        if (d._children == null && d.children == null && d.lines) {
            tooltip.html(d.lines)
                .style("left", (d3.event.pageX + 10) + "px")
                .style("top", (d3.event.pageY + 10) + "px")
                .style("opacity", 1);
        }

        d3.select(this).select("circle")
            .style("stroke-width", "3px")
            .style("stroke", "#2c7be5");
    }

    function mouseout(d) {
        tooltip.style("opacity", 0);

        d3.select(this).select("circle")
            .style("stroke-width", function(d) {
                return d._children || d.children ? "2px" : "1px";
            })
            .style("stroke", function(d) {
                return d._children ? "#d4c9a1" : (d.children ? "#4a90e2" : "#2c7be5");
            });
    }

    function deleteAll() {
        document.getElementById('sideul').innerHTML = '';
    }

    function getNodePath(node) {
        var path = [];
        var parentNode = node;
        while (parentNode && parentNode !== myData) {
            path.unshift(parentNode.name);
            parentNode = parentNode.parent;
        }
        return path.length > 0 ? path.join(" > ") : "顶级节点";
    }

    function updateSidebar(node) {
        deleteAll();

        document.getElementById('pathInfo').textContent = "当前路径: " + getNodePath(node);

        if (node !== myData) { // 如果不是根节点，显示返回上级按钮
            var backBtn = document.createElement("li");
            backBtn.className = "back-btn";
            backBtn.textContent = "← 返回上级";
            backBtn.addEventListener("click", function() {
                if (node.parent) {
                    currentSidebarNode = node.parent;
                    updateSidebar(node.parent);
                    if (node.parent.children && node.parent.children.length > 0) {
                        root = node.parent.children[0];
                        root.x0 = height / 2;
                        root.y0 = 0;
                        update(root);
                    }
                }
            });
            document.getElementById('sideul').appendChild(backBtn);
        }

        var children = [];
        if (node.children) {
            children = node.children;
        } else if (node._children) {
            children = node._children;
        }

        if (children.length > 0) {
            children.forEach(function(child) {
                var li = document.createElement("li");
                li.textContent = child.name;

                var childCount = 0;
                if (child.children) childCount += child.children.length;
                if (child._children) childCount += child._children.length;

                var countBadge = document.createElement("span");
                countBadge.className = "child-count";
                countBadge.textContent = childCount;
                li.appendChild(countBadge);

                li.addEventListener("click", function() {
                    d3.selectAll("#sideul li").classed("active", false);
                    this.classList.add("active");

                    root = child;
                    root.x0 = height / 2;
                    root.y0 = 0;
                    update(root);

                    currentSidebarNode = child;
                    updateSidebar(child);
                });
                document.getElementById('sideul').appendChild(li);
            });
        } else {
            if (node.lines) {
                var linesMsg = document.createElement("li");
                linesMsg.textContent = node.lines;
                linesMsg.style.color = "#333";
                linesMsg.style.fontStyle = "normal";
                document.getElementById('sideul').appendChild(linesMsg);
            } else {
                var emptyMsg = document.createElement("li");
                emptyMsg.textContent = "没有子节点";
                emptyMsg.style.color = "#999";
                emptyMsg.style.fontStyle = "italic";
                document.getElementById('sideul').appendChild(emptyMsg);
            }
        }
    }

    function search() {
        var text = document.getElementById('searchText').value.trim();
        if (!text) return;

        var matchedLaws = [];
        var searchResults = document.getElementById('searchResults');
        searchResults.innerHTML = '';

        function traverse(node) {
            if (node.children) node.children.forEach(traverse);
            if (node._children) node._children.forEach(traverse);

            if (node.name && node.name.toLowerCase().includes(text.toLowerCase())) {
                matchedLaws.push(node);
                addSearchResult(node, 'node');
            }
            if (node.lines && node.lines.toLowerCase().includes(text.toLowerCase())) {
                matchedLaws.push(node);
                addSearchResult(node, 'content');
            }
        }

        function addSearchResult(node, type) {
            var item = document.createElement('div');
            item.className = 'search-result-item';
            item.textContent = node.name;
            if (type === 'content') {
                item.innerHTML += ' <span style="color:#888;font-size:12px;">(内容匹配)</span>';
            }
            item.addEventListener('click', function() {
                currentSidebarNode = node;
                updateSidebar(node);
                root = node;
                root.x0 = height / 2;
                root.y0 = 400;
                update(root);
                searchResults.style.display = 'none';
            });
            searchResults.appendChild(item);
        }

        traverse(myData);

        if (matchedLaws.length > 0) {
            searchResults.style.display = 'block';
        } else {
            searchResults.innerHTML = '<div class="search-result-item">未找到匹配结果</div>';
            searchResults.style.display = 'block';
        }
    }

    document.getElementById('searchText').addEventListener('input', function() {
        var text = this.value.trim();
        if (text.length > 0) {
            search();
        } else {
            document.getElementById('searchResults').style.display = 'none';
            currentSidebarNode = myData;
            updateSidebar(myData);
        }
    });

    document.getElementById('searchBtn').addEventListener('click', search);

    document.getElementById('searchText').addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            search();
        }
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.parent')) {
            document.getElementById('searchResults').style.display = 'none';
        }
    });

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('visible');
    }

    window.addEventListener('resize', function() {
        var isCollapsed = document.getElementById('sidebar').classList.contains('visible');
        var newWidth = isCollapsed ?
            window.innerWidth - margin.right - margin.left - 20 :
            window.innerWidth - margin.right - margin.left - 300;
        var newHeight = window.innerHeight - margin.top - margin.bottom - 20;

        tree.size([newHeight, newWidth]);

        d3.select("svg")
            .attr("width", newWidth + margin.right + margin.left)
            .attr("height", newHeight + margin.top + margin.bottom);

        if (root) update(root);
    });

    initChart();
</script>
</body>
</html>
