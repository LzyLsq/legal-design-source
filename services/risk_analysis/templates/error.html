<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交失败</title>
    <style>
        :root {
            --primary-color: #BF5700;
            --secondary-color: #D4A017;
            --accent-color: #C41E3A;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            background: linear-gradient(152deg, #f4f2ee 0%, #e0d6c8 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* 法律主题装饰 */
       .legal-deco {
            position: fixed;
            opacity: 0.05;
            z-index: -1;
            pointer-events: none;
        }
       .legal-deco.gavel {
            left: 5%;
            top: 20%;
            width: 200px;
            animation: float 6s ease-in-out infinite;
        }
       .legal-deco.contract {
            right: 5%;
            bottom: 20%;
            width: 180px;
            animation: float 5s ease-in-out infinite 1s;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            position: relative;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        h1::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: var(--secondary-color);
            margin: 15px auto;
            border-radius: 2px;
        }

       .error-container {
            background:
                linear-gradient(to bottom right,
                    rgba(255,255,255,0.9) 0%,
                    rgba(255,251,240,0.9) 100%),

            background-blend-mode: multiply;
            border: 1px solid rgba(191,87,0,0.2);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s;
            text-align: center;
        }
       .error-container:hover {
            transform: translateY(-5px);
        }

       .error-message {
            color: var(--accent-color);
            background-color: rgba(196, 30, 58, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 6px solid var(--accent-color);
        }

        button {
            background: linear-gradient(135deg, var(--primary-color), #34495e);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg,
                transparent 25%,
                rgba(255,255,255,0.15) 50%,
                transparent 75%
            );
            transform: rotate(45deg);
            animation: btnShine 3s infinite linear;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes btnShine {
            0% { background-position: -100px; }
            100% { background-position: 100px; }
        }

        @media (max-width: 768px) {
           .error-container {
                padding: 25px;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- 法律主题装饰 -->
    <div class="legal-deco gavel">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="var(--primary-color)">
            <path d="M12 2L9 5l3 3 3-3-3-3zm0 18l-3-3 3-3 3 3-3 3zm8-8h-5v-2h5v2zm-5-4h5V6h-5v2zM4 11h5V9H4v2zm5 4H4v2h5v-2z"/>
        </svg>
    </div>

    <div class="legal-deco contract">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="var(--secondary-color)">
            <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zm-9-1l-4-4 1.4-1vvvvvvvvvvvvvvvvvvvbbvvbvvvvvvvv.4 2.6 2.6 5.6-5.6L18 13l-7 7z"/>
        </svg>
    </div>

    <h1>提交失败</h1>
    <div class="error-container">
        <div class="error-message">
            {{ message }}
        </div>
        <button onclick="window.location.href='/'">返回表单</button>
    </div>
</body>
</html>
