<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法律管理系统 - 管理员登录</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --light-color: #ecf0f1;
            --dark-color: #34495e;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
            --text-color: #2c3e50;
            --text-light: #7f8c8d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans SC', sans-serif;
        }

        body {
            background-color: var(--dark-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 粒子背景效果 */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--dark-color) 0%, #2c3e50 100%);
            z-index: -1;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem 3rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            transform: translateY(0);
            animation: fadeInUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                    to bottom right,
                    rgba(52, 152, 219, 0.1) 0%,
                    rgba(231, 76, 60, 0.1) 100%
            );
            transform: rotate(30deg);
            z-index: -1;
            animation: gradientRotate 15s infinite linear;
        }

        @keyframes gradientRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
            z-index: 1;
        }

        .logo img {
            width: 180px;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
            animation: float 4s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .logo:hover img {
            filter: drop-shadow(0 8px 25px rgba(0, 0, 0, 0.3));
        }

        .form-group {
            margin-bottom: 1.8rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.75rem;
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--secondary-color);
            transition: width 0.4s ease;
            z-index: 2;
        }

        .input-wrapper.focused::before {
            width: 100%;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 1.1rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.4s ease;
            position: relative;
            z-index: 1;
            background: rgba(236, 240, 241, 0.7);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
            color: var(--text-color);
        }

        input:focus {
            outline: none;
            background: rgba(236, 240, 241, 0.9);
        }

        .input-icon {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            z-index: 2;
            transition: all 0.3s ease;
        }

        .form-group:focus-within .input-icon {
            color: var(--secondary-color);
            transform: translateY(-50%) scale(1.1);
        }

        .btn-login {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 1;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(52, 152, 219, 0.4);
        }

        .btn-login:hover::before {
            opacity: 1;
        }

        .btn-login:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-login .icon {
            margin-left: 8px;
            transition: transform 0.3s ease;
        }

        .btn-login:hover .icon {
            transform: translateX(5px);
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }

        .link {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            position: relative;
            padding-bottom: 3px;
        }

        .link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--secondary-color);
            transition: width 0.3s ease;
        }

        .link:hover {
            color: var(--secondary-color);
        }

        .link:hover::after {
            width: 100%;
        }

        .copyright {
            text-align: center;
            margin-top: 3rem;
            color: var(--text-light);
            font-size: 0.8rem;
            opacity: 0.8;
            position: relative;
            z-index: 1;
        }

        .copyright a {
            color: inherit;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .copyright a:hover {
            color: var(--secondary-color);
        }

        /* 响应式设计 */
        @media (max-width: 576px) {
            .login-container {
                padding: 2rem 1.5rem;
                margin: 0 1rem;
            }

            .logo img {
                width: 150px;
            }
        }

        /* 加载动画 */
        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 波纹效果 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.7);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(2.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<!-- 粒子背景容器 -->
<div id="particles-js"></div>

<div class="login-container">
    <div class="logo">
        <img src="../static/dist/js/1.png" alt="法律管理系统">
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">管理员账号</label>
            <div class="input-wrapper" id="usernameWrapper">
                <input type="text" id="username" placeholder="请输入管理员账号" required>
                <span class="input-icon">👤</span>
            </div>
        </div>
        <div class="form-group">
            <label for="password">登录密码</label>
            <div class="input-wrapper" id="passwordWrapper">
                <input type="password" id="password" placeholder="请输入登录密码" required>
                <span class="input-icon">🔒</span>
            </div>
        </div>
        <button type="button" class="btn-login" id="loginBtn" onclick="submitLoginForm()">
            登录系统
            <span class="icon">→</span>
            <span class="loader" id="loader"></span>
        </button>
        <div class="links">
            <a href="{{ url_for('administrator1_page') }}" class="link">修改密码</a>
            <a href="http://127.0.0.1:5000" class="link">返回首页</a>
        </div>
    </form>

    <div class="copyright">
        © 2025 某某律师事务所 版权所有 | 备案号：XXX-XXXXXXX
    </div>
</div>

<!-- 粒子效果库 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/particlesjs/2.0.0/particles.min.js"></script>

<script>
    // 初始化粒子效果
    document.addEventListener('DOMContentLoaded', function() {
        particlesJS('particles-js', {
            "particles": {
                "number": {
                    "value": 80,
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    "value": "#ffffff"
                },
                "shape": {
                    "type": "circle",
                    "stroke": {
                        "width": 0,
                        "color": "#000000"
                    },
                    "polygon": {
                        "nb_sides": 5
                    }
                },
                "opacity": {
                    "value": 0.5,
                    "random": true,
                    "anim": {
                        "enable": true,
                        "speed": 1,
                        "opacity_min": 0.1,
                        "sync": false
                    }
                },
                "size": {
                    "value": 3,
                    "random": true,
                    "anim": {
                        "enable": true,
                        "speed": 2,
                        "size_min": 0.1,
                        "sync": false
                    }
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#ffffff",
                    "opacity": 0.4,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 1,
                    "direction": "none",
                    "random": true,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": {
                        "enable": false,
                        "rotateX": 600,
                        "rotateY": 1200
                    }
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "grab"
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push"
                    },
                    "resize": true
                },
                "modes": {
                    "grab": {
                        "distance": 140,
                        "line_linked": {
                            "opacity": 1
                        }
                    },
                    "bubble": {
                        "distance": 400,
                        "size": 40,
                        "duration": 2,
                        "opacity": 8,
                        "speed": 3
                    },
                    "repulse": {
                        "distance": 200,
                        "duration": 0.4
                    },
                    "push": {
                        "particles_nb": 4
                    },
                    "remove": {
                        "particles_nb": 2
                    }
                }
            },
            "retina_detect": true
        });

        // 输入框聚焦效果
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            const wrapper = input.parentElement;

            input.addEventListener('focus', () => {
                wrapper.classList.add('focused');
            });

            input.addEventListener('blur', () => {
                wrapper.classList.remove('focused');
            });
        });

        // 按钮波纹效果
        const loginBtn = document.getElementById('loginBtn');
        loginBtn.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;

            this.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();
            }, 600);
        });
    });

    // 提交登录表单
    function submitLoginForm() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const loginBtn = document.getElementById('loginBtn');
        const loader = document.getElementById('loader');

        if (!username || !password) {
            animateError();
            return;
        }

        // 显示加载动画
        loginBtn.disabled = true;
        loader.style.display = 'inline-block';
        loginBtn.querySelector('.icon').style.display = 'none';

        // 模拟网络请求延迟
        setTimeout(() => {
            fetch('/administrator', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // 登录成功动画
                        animateSuccess(() => {
                            window.location.href = data.redirect_url;
                        });
                    } else {
                        animateError();
                        alert(data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    animateError();
                    alert('登录失败，请稍后再试。');
                })
                .finally(() => {
                    loginBtn.disabled = false;
                    loader.style.display = 'none';
                    loginBtn.querySelector('.icon').style.display = 'inline-block';
                });
        }, 1000);
    }

    // 登录成功动画
    function animateSuccess(callback) {
        const loginContainer = document.querySelector('.login-container');
        loginContainer.style.animation = 'none';
        void loginContainer.offsetWidth; // 触发重绘
        loginContainer.style.animation = 'fadeInUp 0.5s ease-out';

        loginContainer.style.transform = 'scale(0.95)';
        loginContainer.style.boxShadow = '0 0 0 5px rgba(46, 204, 113, 0.5)';

        setTimeout(() => {
            loginContainer.style.transform = 'scale(1)';
            loginContainer.style.boxShadow = '0 25px 50px rgba(0, 0, 0, 0.3)';

            if (callback) callback();
        }, 300);
    }

    // 登录错误动画
    function animateError() {
        const loginForm = document.getElementById('loginForm');
        loginForm.style.animation = 'none';
        void loginForm.offsetWidth; // 触发重绘

        loginForm.style.animation = 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both';

        // 添加shake动画
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                10%, 90% { transform: translateX(-2px); }
                20%, 80% { transform: translateX(4px); }
                30%, 50%, 70% { transform: translateX(-6px); }
                40%, 60% { transform: translateX(6px); }
            }
        `;
        document.head.appendChild(style);

        setTimeout(() => {
            document.head.removeChild(style);
        }, 500);
    }
</script>

</body>
</html>
