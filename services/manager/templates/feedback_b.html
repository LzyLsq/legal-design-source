<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诉讼模板反馈管理</title>
  <link href="https://cdn.jsdelivr.net.cn/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net.cn/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3f37c9;
      --success-color: #4cc9f0;
      --warning-color: #f8961e;
      --danger-color: #f72585;
      --light-color: #f8f9fa;
      --dark-color: #212529;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* 粒子背景样式 */
    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 0;
      opacity: 0.5;
    }

    .container {
      position: relative;
      z-index: 1;
    }

    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background-color: rgba(255, 255, 255, 0.9);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }

    .card-header {
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      color: white;
      font-weight: 600;
      border-bottom: none;
      padding: 1.2rem 1.5rem;
    }

    .table {
      margin-bottom: 0;
    }

    .table th {
      background-color: rgba(67, 97, 238, 0.1);
      color: var(--primary-color);
      font-weight: 600;
      border-top: none;
      padding: 1rem;
    }

    .table td {
      padding: 0.8rem 1rem;
      vertical-align: middle;
    }

    .feedback-item {
      transition: all 0.3s ease;
      border-left: 4px solid transparent;
    }

    .feedback-item:hover {
      background-color: rgba(67, 97, 238, 0.05);
      border-left: 4px solid var(--primary-color);
      transform: translateX(5px);
    }

    .processed {
      background-color: rgba(76, 201, 240, 0.1);
    }

    .unprocessed {
      background-color: rgba(248, 150, 30, 0.1);
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 50px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .bg-success {
      background-color: var(--success-color) !important;
    }

    .bg-warning {
      background-color: var(--warning-color) !important;
    }

    .btn {
      border-radius: 50px;
      padding: 0.5rem 1.2rem;
      font-weight: 500;
      transition: all 0.3s ease;
      border: none;
    }

    .btn-outline-primary {
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
    }

    .btn-outline-primary:hover {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-success {
      background-color: var(--success-color);
    }

    .btn-success:hover {
      background-color: #3aa8d4;
    }

    .modal-content {
      border: none;
      border-radius: 15px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      color: white;
      border-bottom: none;
      border-radius: 15px 15px 0 0 !important;
    }

    .modal-body {
      padding: 2rem;
    }

    .form-control, .form-select {
      border-radius: 50px;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .detail-section {
      background-color: rgba(67, 97, 238, 0.05);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .detail-title {
      color: var(--primary-color);
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
    }

    .detail-title i {
      margin-right: 0.5rem;
    }

    h2 {
      color: var(--dark-color);
      font-weight: 700;
      margin-bottom: 1.5rem;
      position: relative;
      display: inline-block;
    }

    h2:after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 50px;
      height: 4px;
      background: var(--primary-color);
      border-radius: 2px;
    }

    @media (max-width: 768px) {
      .card-header {
        padding: 1rem;
      }

      .table th, .table td {
        padding: 0.6rem;
      }

      .modal-body {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
<!-- 粒子背景容器 -->
<div id="particles-js"></div>

<div class="container mt-4">
  <h2 class="mb-4">诉讼模板反馈管理</h2>
  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span><i class="bi bi-list-check"></i> 反馈列表</span>
      <div>
        <button class="btn btn-sm btn-outline-danger me-2" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i> 退出
        </button>
        <button class="btn btn-sm btn-outline-primary" onclick="refreshFeedbackList()">
          <i class="bi bi-arrow-clockwise"></i> 刷新
        </button>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
          <tr>
            <th><i class="bi bi-hash"></i> ID</th>
            <th><i class="bi bi-file-earmark-text"></i> 诉讼模板</th>
            <th><i class="bi bi-chat-square-text"></i> 反馈内容</th>
            <th><i class="bi bi-person"></i> 提交人</th>
            <th><i class="bi bi-clock"></i> 提交时间</th>
            <th><i class="bi bi-info-circle"></i> 状态</th>
            <th><i class="bi bi-gear"></i> 操作</th>
          </tr>
          </thead>
          <tbody id="feedbackTableBody">
          <!-- 反馈列表将通过JavaScript动态加载 -->
          <tr>
            <td colspan="7" class="text-center py-4">正在加载数据...</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 反馈详情模态框 -->
<div class="modal fade" id="feedbackDetailModal" tabindex="-1" aria-labelledby="feedbackDetailModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="feedbackDetailModalLabel"><i class="bi bi-chat-square-text"></i> 反馈详情</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row mb-4">
          <div class="col-md-6">
            <div class="detail-section">
              <div class="detail-title"><i class="bi bi-info-circle"></i> 基本信息</div>
              <p><strong>ID:</strong> <span id="detailId">-</span></p>
              <p><strong>诉讼模板:</strong> <span id="detailTemplate">-</span></p>
              <p><strong>提交人:</strong> <span id="detailSubmitter">-</span></p>
            </div>
          </div>
          <div class="col-md-6">
            <div class="detail-section">
              <div class="detail-title"><i class="bi bi-clock-history"></i> 时间信息</div>
              <p><strong>提交时间:</strong> <span id="detailCreateTime">-</span></p>
              <p><strong>处理状态:</strong> <span id="detailStatus">-</span></p>
              <p><strong>处理时间:</strong> <span id="detailUpdateTime">-</span></p>
            </div>
          </div>
        </div>
        <div class="detail-section mb-4">
          <div class="detail-title"><i class="bi bi-chat-left-text"></i> 反馈内容</div>
          <div class="border p-3 bg-light rounded" id="detailContent">-</div>
        </div>
        <div class="detail-section">
          <div class="detail-title"><i class="bi bi-pencil-square"></i> 备注</div>
          <div class="border p-3 bg-light rounded" id="detailRemark">-</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> 关闭</button>
        <button type="button" class="btn btn-success" id="markAsProcessedBtn"><i class="bi bi-check-circle"></i> 标记为已处理</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net.cn/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net.cn/npm/particles.js@2.0.0/particles.min.js"></script>
<script>
  let currentFeedbackId = null;
  const feedbackDetailModal = new bootstrap.Modal(document.getElementById('feedbackDetailModal'));

  // 初始化粒子背景
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof particlesJS !== 'undefined') {
      particlesJS('particles-js', {
        "particles": {
          "number": {
            "value": 80,
            "density": {
              "enable": true,
              "value_area": 800
            }
          },
          "color": {
            "value": "#4361ee"
          },
          "shape": {
            "type": "circle",
            "stroke": {
              "width": 0,
              "color": "#000000"
            },
            "polygon": {
              "nb_sides": 5
            }
          },
          "opacity": {
            "value": 0.3,
            "random": false,
            "anim": {
              "enable": false,
              "speed": 1,
              "opacity_min": 0.1,
              "sync": false
            }
          },
          "size": {
            "value": 3,
            "random": true,
            "anim": {
              "enable": false,
              "speed": 40,
              "size_min": 0.1,
              "sync": false
            }
          },
          "line_linked": {
            "enable": true,
            "distance": 150,
            "color": "#4361ee",
            "opacity": 0.2,
            "width": 1
          },
          "move": {
            "enable": true,
            "speed": 2,
            "direction": "none",
            "random": false,
            "straight": false,
            "out_mode": "out",
            "bounce": false,
            "attract": {
              "enable": false,
              "rotateX": 600,
              "rotateY": 1200
            }
          }
        },
        "interactivity": {
          "detect_on": "canvas",
          "events": {
            "onhover": {
              "enable": true,
              "mode": "grab"
            },
            "onclick": {
              "enable": true,
              "mode": "push"
            },
            "resize": true
          },
          "modes": {
            "grab": {
              "distance": 140,
              "line_linked": {
                "opacity": 1
              }
            },
            "bubble": {
              "distance": 400,
              "size": 40,
              "duration": 2,
              "opacity": 8,
              "speed": 3
            },
            "repulse": {
              "distance": 200,
              "duration": 0.4
            },
            "push": {
              "particles_nb": 4
            },
            "remove": {
              "particles_nb": 2
            }
          }
        },
        "retina_detect": true
      });
    } else {
      console.warn('particlesJS未加载成功，背景效果将不可用');
    }

    // 页面加载时获取反馈列表
    refreshFeedbackList();

    // 标记为已处理按钮点击事件
    $('#markAsProcessedBtn').click(function() {
      if (currentFeedbackId) {
        markAsProcessed(currentFeedbackId);
      }
    });
  });

  function logout() {
    if (confirm('确定要退出系统吗？')) {
      // 这里替换为实际的退出逻辑
      // 例如：跳转到登录页或调用退出API
      alert('已退出系统');
      window.location.href = 'http://127.0.0.1:8003/model';
    }
  }

  // 刷新反馈列表
  function refreshFeedbackList() {
    $.ajax({
      url: '/api/feedback',
      type: 'GET',
      dataType: 'json',
      beforeSend: function() {
        $('#feedbackTableBody').html('<tr><td colspan="7" class="text-center py-4">正在加载数据...</td></tr>');
      },
      success: function(response) {
        if (response && response.code === 200) {
          renderFeedbackList(response.data);
        } else {
          const errorMsg = response ? response.message : '未知错误';
          $('#feedbackTableBody').html(`<tr><td colspan="7" class="text-center py-4 text-danger">获取反馈列表失败: ${errorMsg}</td></tr>`);
        }
      },
      error: function(xhr, status, error) {
        $('#feedbackTableBody').html(`<tr><td colspan="7" class="text-center py-4 text-danger">请求失败: ${error}</td></tr>`);
      }
    });
  }

  // 渲染反馈列表
  function renderFeedbackList(feedbackList) {
    const tableBody = $('#feedbackTableBody');
    tableBody.empty();

    if (!feedbackList || feedbackList.length === 0) {
      tableBody.append('<tr><td colspan="7" class="text-center py-4">暂无反馈数据</td></tr>');
      return;
    }

    feedbackList.forEach(feedback => {
      const statusClass = feedback.is_processed ? 'bg-success' : 'bg-warning';
      const statusText = feedback.is_processed ? '已处理' : '未处理';
      const rowClass = feedback.is_processed ? 'processed' : 'unprocessed';

      // 截取部分内容作为预览
      const contentPreview = feedback.content && feedback.content.length > 30 ?
              feedback.content.substring(0, 30) + '...' : feedback.content || '无内容';

      const row = `
                    <tr class="feedback-item ${rowClass}" data-id="${feedback.id}">
                        <td>${feedback.id || '-'}</td>
                        <td>${feedback.template_name || '未指定'}</td>
                        <td>${contentPreview}</td>
                        <td>${feedback.submitter || '匿名'}</td>
                        <td>${feedback.create_time || '-'}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary view-btn" data-id="${feedback.id}">
                                <i class="bi bi-eye"></i> 查看
                            </button>
                        </td>
                    </tr>
                `;
      tableBody.append(row);
    });

    // 绑定查看按钮点击事件
    $('.view-btn').click(function() {
      const feedbackId = $(this).data('id');
      showFeedbackDetail(feedbackId);
    });
  }

  // 显示反馈详情
  function showFeedbackDetail(feedbackId) {
    currentFeedbackId = feedbackId;

    $.ajax({
      url: `/api/feedback/${feedbackId}`,
      type: 'GET',
      dataType: 'json',
      beforeSend: function() {
        // 清空或显示加载状态
        $('#detailId').text('加载中...');
        $('#detailTemplate').text('加载中...');
        $('#detailSubmitter').text('加载中...');
        $('#detailCreateTime').text('加载中...');
        $('#detailUpdateTime').text('加载中...');
        $('#detailContent').text('加载中...');
        $('#detailRemark').text('加载中...');
      },
      success: function(response) {
        if (response && response.code === 200) {
          const feedback = response.data;

          // 填充模态框内容
          $('#detailId').text(feedback.id || '-');
          $('#detailTemplate').text(feedback.template_name || '未指定');
          $('#detailSubmitter').text(feedback.submitter || '匿名');
          $('#detailCreateTime').text(feedback.create_time || '-');
          $('#detailUpdateTime').text(feedback.update_time || '未处理');
          $('#detailContent').text(feedback.content || '无内容');
          $('#detailRemark').text(feedback.remark || '无');

          // 更新状态显示
          const statusText = feedback.is_processed ? '已处理' : '未处理';
          const statusClass = feedback.is_processed ? 'text-success' : 'text-warning';
          $('#detailStatus').html(`<span class="${statusClass} fw-bold">${statusText}</span>`);

          // 根据处理状态显示/隐藏标记按钮
          if (feedback.is_processed) {
            $('#markAsProcessedBtn').hide();
          } else {
            $('#markAsProcessedBtn').show();
          }

          // 显示模态框
          feedbackDetailModal.show();
        } else {
          const errorMsg = response ? response.message : '未知错误';
          alert('获取反馈详情失败: ' + errorMsg);
        }
      },
      error: function(xhr, status, error) {
        alert('请求失败: ' + error);
      }
    });
  }

  // 标记为已处理
  function markAsProcessed(feedbackId) {
    if (!confirm('确定要将此反馈标记为已处理吗？')) {
      return;
    }

    $.ajax({
      url: `/api/feedback/${feedbackId}/mark`,
      type: 'POST',
      dataType: 'json',
      success: function(response) {
        if (response && response.code === 200) {
          alert('标记成功');
          feedbackDetailModal.hide();
          refreshFeedbackList();
        } else {
          const errorMsg = response ? response.message : '未知错误';
          alert('标记失败: ' + errorMsg);
        }
      },
      error: function(xhr, status, error) {
        alert('请求失败: ' + error);
      }
    });
  }
</script>
</body>
</html>
