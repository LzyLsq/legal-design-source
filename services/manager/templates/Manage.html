<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能管理中枢 | 控制面板</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4361ee;
      --secondary: #3a0ca3;
      --accent: #f72585;
      --success: #4cc9f0;
      --warning: #f8961e;
      --dark: #1a1a2e;
      --darker: #0d0d1a;
      --light: #f8f9fa;
      --glass: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
      color: var(--light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      perspective: 1000px;
    }

    /* 高级背景效果 */
    .bg-pattern {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
              radial-gradient(circle at 20% 30%, rgba(67, 97, 238, 0.15) 0%, transparent 20%),
              radial-gradient(circle at 80% 70%, rgba(248, 37, 133, 0.15) 0%, transparent 20%),
              radial-gradient(circle at 40% 80%, rgba(76, 201, 240, 0.15) 0%, transparent 20%);
      z-index: -2;
    }

    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
              linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
      opacity: 0.5;
    }

    /* 主容器 */
    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 1;
      transform-style: preserve-3d;
      animation: fadeIn 1s ease-out forwards;
    }

    /* 卡片设计 */
    .card {
      background: linear-gradient(145deg, rgba(26, 26, 46, 0.8), rgba(13, 13, 26, 0.9));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 40px;
      max-width: 700px;
      margin: 0 auto;
      box-shadow:
              0 8px 32px rgba(0, 0, 0, 0.3),
              inset 0 1px 1px rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transform: translateY(20px);
      opacity: 0;
      animation: cardEntry 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
              45deg,
              transparent 0%,
              rgba(255, 255, 255, 0.03) 50%,
              transparent 100%
      );
      transform: rotate(45deg);
      animation: shine 6s infinite;
    }

    /* 标题样式 */
    h1 {
      font-size: 2.8rem;
      margin-bottom: 2.5rem;
      color: var(--light);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      font-weight: 700;
      background: linear-gradient(90deg, #fff, #a5b4fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      position: relative;
      display: inline-block;
    }

    h1::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--primary));
      border-radius: 3px;
    }

    /* 按钮组 */
    .button-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    /* 按钮设计 */
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 25px;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.4s cubic-bezier(0.65, 0, 0.35, 1);
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      border: none;
      cursor: pointer;
      transform: translateY(30px);
      opacity: 0;
      animation: buttonEntry 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      z-index: 1;
    }

    .button i {
      margin-right: 10px;
      font-size: 1.2rem;
    }

    .button::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
      z-index: -1;
    }

    .button:hover::before {
      transform: translateX(100%);
    }

    .button:nth-child(1) {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      animation-delay: 0.5s;
    }

    .button:nth-child(2) {
      background: linear-gradient(135deg, var(--accent), #b5179e);
      animation-delay: 0.6s;
    }

    .button:nth-child(3) {
      background: linear-gradient(135deg, var(--success), #4895ef);
      animation-delay: 0.7s;
    }

    .button:nth-child(4) {
      background: linear-gradient(135deg, var(--warning), #f3722c);
      animation-delay: 0.8s;
    }

    .button:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
    }

    .button:active {
      transform: translateY(0) scale(0.98);
    }

    /* 退出按钮样式 */
    .exit-button {
      position: absolute;
      top: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
      opacity: 0;
      animation: fadeIn 0.5s ease-out 1s forwards;
    }

    .exit-button:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
      color: white;
      transform: scale(1.1);
    }

    /* 浮动粒子 */
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      filter: blur(1px);
    }

    /* 底部信息 */
    .footer {
      margin-top: 40px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
      animation: fadeIn 1s ease-out 1s forwards;
      opacity: 0;
    }

    /* 动画定义 */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes cardEntry {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes buttonEntry {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes shine {
      0% { transform: rotate(45deg) translate(-30%, -30%); }
      100% { transform: rotate(45deg) translate(30%, 30%); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .card {
        padding: 30px 20px;
        border-radius: 16px;
      }

      h1 {
        font-size: 2.2rem;
        margin-bottom: 1.8rem;
      }

      .button-group {
        grid-template-columns: 1fr;
      }

      .button {
        padding: 16px 20px;
      }

      .exit-button {
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
<!-- 背景元素 -->
<div class="bg-pattern"></div>
<div class="bg-grid"></div>

<!-- 退出按钮 -->
<a href="http://127.0.0.1:5011" class="exit-button">
  <i class="fas fa-sign-out-alt"></i>
</a>

<!-- 主内容 -->
<div class="container">
  <div class="card">
    <h1>管理中枢</h1>
    <p style="color: rgba(255,255,255,0.7); margin-bottom: 10px; animation: fadeIn 1s ease-out 0.5s forwards; opacity: 0;">
      综合管理系统控制面板
    </p>

    <div class="button-group">
      <a href="http://127.0.0.1:5008" class="button">
        <i class="fas fa-chart-line"></i> 大屏可视化
      </a>
      <a href="http://127.0.0.1:5009" class="button">
        <i class="fas fa-users"></i> 用户信息查询
      </a>
      <a href="http://127.0.0.1:5010" class="button">
        <i class="fas fa-file-contract"></i> 合同信息查询
      </a>
      <a href="http://127.0.0.1:8003/model" class="button">
        <i class="fas fa-cubes"></i> 模板管理
      </a>
    </div>
  </div>

  <div class="footer">
    <p>© 2025 智能管理系统</p>
  </div>
</div>

<script>
  // 高级粒子效果
  document.addEventListener('DOMContentLoaded', function() {
    const colors = [
      'rgba(67, 97, 238, 0.6)',
      'rgba(248, 37, 133, 0.6)',
      'rgba(76, 201, 240, 0.6)',
      'rgba(248, 150, 30, 0.6)'
    ];

    // 创建大粒子背景
    for (let i = 0; i < 15; i++) {
      createParticle(
              Math.random() * window.innerWidth,
              Math.random() * window.innerHeight,
              Math.random() * 100 + 50, // 大小
              colors[Math.floor(Math.random() * colors.length)],
              true
      );
    }

    // 创建小粒子背景
    for (let i = 0; i < 30; i++) {
      createParticle(
              Math.random() * window.innerWidth,
              Math.random() * window.innerHeight,
              Math.random() * 20 + 5, // 大小
              colors[Math.floor(Math.random() * colors.length)],
              false
      );
    }

    function createParticle(x, y, size, color, isLarge) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      particle.style.background = color;
      particle.style.opacity = Math.random() * 0.5 + 0.1;

      if (isLarge) {
        particle.style.filter = 'blur(2px)';
        particle.style.animation = `float ${Math.random() * 10 + 10}s infinite ease-in-out`;
        particle.style.animationDelay = `${Math.random() * 5}s`;
      } else {
        particle.style.animation = `float ${Math.random() * 8 + 6}s infinite ease-in-out`;
        particle.style.animationDelay = `${Math.random() * 3}s`;
      }

      document.body.appendChild(particle);
    }

    // 鼠标移动粒子效果
    document.addEventListener('mousemove', function(e) {
      if (Math.random() > 0.3) return; // 降低粒子生成频率

      const size = Math.random() * 10 + 5;
      const particle = document.createElement('div');
      particle.classList.add('particle');
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${e.clientX}px`;
      particle.style.top = `${e.clientY}px`;
      particle.style.background = colors[Math.floor(Math.random() * colors.length)];
      particle.style.opacity = 0.7;
      particle.style.transition = 'all 1s ease-out';
      particle.style.transform = `scale(${Math.random() * 0.5 + 0.5})`;

      document.body.appendChild(particle);

      // 粒子动画
      setTimeout(() => {
        particle.style.opacity = '0';
        particle.style.transform = `translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px) scale(0)`;
      }, 10);

      // 移除粒子
      setTimeout(() => {
        particle.remove();
      }, 1000);
    });
  });
</script>
</body>
</html>
