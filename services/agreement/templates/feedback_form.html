<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反馈表单</title>
    <style>
        :root {
            --primary-color: #BF5700;
            --secondary-color: #D4A017;
            --accent-color: #C41E3A;
            --background-color: #FFF8E7;
            --form-bg-color: rgba(255, 255, 255, 0.9);
            --input-border-color: #E8D6B5;
            --input-focus-border-color: var(--primary-color);
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(152deg, #f4f2ee 0%, #e0d6c8 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 增加装饰元素 */
        .legal-decoration {
            position: fixed;
            opacity: 0.05;
            z-index: -1;
            pointer-events: none;
        }

        .legal-decoration.gavel {
            left: 2%;
            top: 15%;
            width: 120px;
            animation: float 6s ease-in-out infinite;
        }

        .legal-decoration.contract {
            right: 2%;
            bottom: 15%;
            width: 100px;
            animation: float 5s ease-in-out infinite 1s;
        }

        .legal-decoration.law-book {
            left: 10%;
            bottom: 10%;
            width: 80px;
            animation: rotate 15s linear infinite;
        }

        .legal-decoration.stamp {
            right: 10%;
            top: 20%;
            width: 70px;
            animation: float 7s ease-in-out infinite 2s;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            font-size: 2.2rem;
            margin: 20px 0 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            position: relative;
            padding-bottom: 15px;
        }

        h1::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 3px;
            background: var(--secondary-color);
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .form-container {
            background:
                    linear-gradient(to bottom right, var(--form-bg-color) 0%, rgba(255, 251, 240, 0.9) 100%),

            background-blend-mode: multiply;
            border: 1px solid rgba(191, 87, 0, 0.2);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 40px var(--shadow-color);
            transition: transform 0.3s, box-shadow 0.3s;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .form-container:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px var(--shadow-color);
        }

        .form-section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(191, 87, 0, 0.1);
        }

        .form-section:last-child {
            border-bottom: none;
        }

        .form-section h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.5rem;
            position: relative;
            padding-bottom: 10px;
        }

        .form-section h2::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 3px;
            background: var(--secondary-color);
            bottom: 0;
            left: 0;
            border-radius: 2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.75rem;
            font-weight: 600;
            color: var(--primary-color);
            font-size: 0.95rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--input-border-color);
            border-radius: 10px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--input-focus-border-color);
            background: rgba(255, 255, 255, 0.95);
            outline: none;
            box-shadow: 0 0 0 3px rgba(191, 87, 0, 0.1);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            gap: 1.5rem;
            margin-top: 2rem;
            align-items: center;
        }

        button {
            background: linear-gradient(135deg, var(--primary-color), #34495e);
            color: white;
            border: none;
            padding: 1.2rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg,
            transparent 25%,
            rgba(255, 255, 255, 0.15) 50%,
            transparent 75%);
            transform: rotate(45deg);
            animation: btnShine 3s infinite linear;
        }

        button::after {
            content: '✍';
            position: absolute;
            right: 15px;
            font-size: 1.2em;
            filter: sepia(1) hue-rotate(-10deg);
            opacity: 0.8;
            transition: transform 0.3s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        button:hover::after {
            transform: scale(1.2);
        }

        .submit-notice {
            background-color: rgba(212, 175, 55, 0.1);
            border-left: 4px solid var(--secondary-color);
            padding: 1.2rem;
            margin-right: 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            max-width: 300px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }

        .submit-notice strong {
            color: var(--primary-color);
            display: block;
            margin-bottom: 5px;
        }

        .submit-notice ul {
            margin-top: 5px;
            padding-left: 20px;
        }

        .submit-notice li {
            margin-bottom: 3px;
        }

        .form-group.invalid input,
        .form-group.invalid select,
        .form-group.invalid textarea {
            border-color: var(--accent-color);
            animation: shake 0.4s;
        }

        .error-message {
            color: var(--accent-color);
            font-size: 0.875rem;
            margin-top: 0.3rem;
            display: none;
        }

        .form-group.invalid .error-message {
            display: block;
        }

        .result-container {
            display: none;
            background:
                    linear-gradient(to bottom right, var(--form-bg-color) 0%, rgba(255, 251, 240, 0.9) 100%),
                    url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAMAAAAp4XiDAAAAUVBMVEWFhYWDg4N3d3dtbW17e3t1dXWBgYGHh4d5eXlzc3OLi4ubm5uVlZWPj4+NjY19fX2JiYl/f39ra2uRkZGZmZlpaWmXl5dvb29xcXGTk5NnZ2c8TV1mAAAAG3RSTlNAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEAvEOwtAAAFVklEQVR4XpWWB67c2BUFb3g557T/hRo9/WUMZHlgr4Bg8Z4qQgQJlHI4A8SzFVrapvmTF9O7dmYRFZ60YiBhJRCgh1FYhiLAmdvX0CzTOpNE77ME0Zty/nWVzchDtiqrmQDeuv3powQ5ta2eN0FY0InkqDD73lT9c9lEzwUNqgFHs9VQce3TVClFCQrSTfOiYkVJQBmpbq2L6iZavPnAPcoU0dSw0SUTqz/GtrGuXfbyyBniKykOWQWGqwwMA7QiYAxi+IlPdqo+hYHnUt5ZPfnsHJyNiDtnpJyayNBkF6cWoYGAMY92U2hXHF/C1M8uP/ZtYdiuj26UdAdQQSXQErwSOMzt/XWRWAz5GuSBIkwG1H3FabJ2OsUOUhGC6tK4EMtJO0ttC6IBD3kM0ve0tJwMdSfjZo+EEISaeTr9P3wYrGjXqyC1krcKdhMpxEnt5JetoulscpyzhXN5FRpuPHvbeQaKxFAEB6EN+cYN6xD7RYGpXpNndMmZgM5Dcs3YSNFDHUo2LGfZuukSWyUYirJAdYbF3MfqEKmjM+I2EfhA94iG3L7uKrR+GdWD73ydlIB+6hgref1QTlmgmbM3/LeX5GI1Ux1RWpgxpLuZ2+I+IjzZ8wqE4nilvQdkUdfhzI5QDWy+kw5Wgg2pGpeEVeCCA7b85BO3F9DzxB3cdqvBzWcmzbyMiqhzuYqtHRVG2y4x+KOlnyqla8AoWWpuBoYRxzXrfKuILl6SfiWCbjxoZJUaCBj1CjH7GIaDbc9kqBY3W/Rgjda1iqQcOJu2WW+76pZC9QG7M00dffe9hNnseupFL53r8F7YHSwJWUKP2q+k7RdsxyOB11n0xtOvnW4irMMFNV4H0uqwS5ExsmP9AxbDTc9JwgneAT5vTiUSm1E7BSflSt3bfa1tv8Di3R8n3Af7MNWzs49hmauE2wP+ttrq+AsWpFG2awvsuOqbipWHgtuvuaAE+A1Z/7gC9hesnr+7wqCwG8c5yAg3AL1fm8T9AZtp/bbJGwl1pNrE7RuOX7PeMRUERVaPpEs+yqeoSmuOlokqw49pgomjLeh7icHNlG19yjs6XXOMedYm5xH2YxpV2tc0Ro2jJfxC50ApuxGob7lMsxfTbeUv07TyYxpeucEH1gNd4IKH2LAg5TdVhlCafZvpskfncCfx8pOhJzd76bJWeYFnFciwcYfubRc12Ip/ppIhA1/mSZ/RxjFDrJC5xifFjJpY2Xl5zXdguFqYyTR1zSp1Y9p+tktDYYSNflcxI0iyO4TPBdlRcpeqjK/piF5bklq77VSEaA+z8qmJTFzIWiitbnzR794USKBUaT0NTEsVjZqLaFVqJoPN9ODG70IPbfBHKK+/q/AWR0tJzYHRLOa4MP+W/HfGadZUbfw177G7j/OGbIs8TahLyynl4X4RinF793Mz+BU0saXtUHrVBFT/DnA3ctNPoGbs4hRIjTok8i+algT1lTHi4SxFvONKNrgQFAq2/gFnWMXgwffgYMJpiKYkmW3tTg3ZQ9Jq+f8XN+A5eeUKHWvJWJ2sgJ1Sop+wwhqFVijqWaJhwtD8MNlSBeWNNWTa5Z5kPZw5+LbVT99wqTdx29lMUH4OIG/D86ruKEauBjvH5xy6um/Sfj7ei6UUVk4AIl3MyD4MSSTOFgSwsH/QJWaQ5as7ZcmgBZkzjjU1UrQ74ci1gWBCSGHtuV1H2mhSnO3Wp/3fEV5a+4wz//6qy             background-blend-mode: multiply;
            border: 1px solid rgba(191, 87, 0, 0.2);
            border-radius: 12px;
            padding: 2rem;
            margin-top: 2rem;
            box-shadow: 0 15px 40px var(--shadow-color);
        }

        .risk-level {
            font-size: 1.6rem;
            font-weight: bold;
            padding: 1.2rem;
            border-radius: 8px;
            text-align: center;
            margin: 1.5rem 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .low-risk {
            background-color: #d4edda;
            color: #155724;
        }

        .medium-risk {
            background-color: #fff3cd;
            color: #856404;
        }

        .high-risk {
            background-color: #f8d7da;
            color: #721c24;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes btnShine {
            0% {
                background-position: -100px;
            }

            100% {
                background-position: 100px;
            }
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .form-container::before {
            content: '⚖';
            position: absolute;
            font-size: 60px;
            opacity: 0.1;
            right: 20px;
            top: 20px;
            transform: rotate(15deg);
        }

        /* 首页按钮样式 */
        .home-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--primary-color), #34495e);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .home-button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* 表单分区装饰 */
        .form-section::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(191, 87, 0, 0.2), transparent);
            top: 0;
            left: 0;
        }

        /* 响应式设计 */
        @media (max-width: 992px) {
            .form-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .form-container {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }

            .submit-notice {
                max-width: none;
                margin-right: 0;
                margin-bottom: 1rem;
            }

            .home-button {
                top: 10px;
                right: 10px;
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .form-section h2 {
                font-size: 1.3rem;
            }

            button {
                padding: 1rem 2rem;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <h1>反馈表单</h1>
    {% if success %}
        <p style="color: green;">感谢您的反馈！您的反馈已成功提交。</p>
    {% elif error %}
        <p style="color: #c0392b; font-weight: 600;">{{ error }}</p>
    {% endif %}

    <form action="/submit_feedback" method="POST">
        <div style="display: flex; gap: 20px;">
            <div style="flex: 1;">
                <label for="template_name">所需模板：</label>
                <input type="text" id="template_name" name="template_name" required style="width: 100%;">
            </div>
            <div style="flex: 1;">
                <label for="submitter">提交人：</label>
                <input type="text" id="submitter" name="submitter" required style="width: 100%;">
            </div>

        <label for="content">反馈内容：</label><br>
        <textarea id="content" name="content" rows="4" cols="50" required></textarea><br><br>

        <button type="submit">提交反馈</button>
    </form>
</body>


<script>


    // 添加表单分区动画效果
    document.querySelectorAll('.form-section').forEach(section => {
        section.addEventListener('mouseenter', function() {
            this.style.transform = 'translateY(-5px)';
            this.style.transition = 'transform 0.3s ease';
        });

        section.addEventListener('mouseleave', function() {
            this.style.transform = 'translateY(0)';
        });
    });
</script>
</body>
